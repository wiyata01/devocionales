name: Actualizar devocionales diarios

on:
  schedule:
    # 02:10 AM hora Colombia = 07:10 UTC
    - cron: "10 7 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      # ---------------------------------------------------------
      # Intentos cada 20 minutos
      # ---------------------------------------------------------

      - name: Buscar los 3 devocionales actualizados
        run: |
          python3 scrape_devocionales.py --reintentos

      # ---------------------------------------------------------
      # Publicar data.json
      # ---------------------------------------------------------

      - name: Publicar data.json actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --staged --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "Actualizar devocionales $(date -u +%Y-%m-%d)"
            git push
          fi
