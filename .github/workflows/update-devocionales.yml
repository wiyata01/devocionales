name: Actualizar devocionales diarios

on:
  schedule:
    # 09:00 UTC ≈ 04:00 America/Bogota. Ajusta la hora si quieres otra.
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar scraper
        run: python3 scrape_devocionales.py

      - name: Publicar data.json actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "Sin cambios" || git commit -m "Actualizar devocionales $(date -u +%Y-%m-%d)"
          git push
