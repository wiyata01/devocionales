name: Actualizar devocionales diarios

on:
  workflow_dispatch:

  schedule:
    - cron: "*/20 10-12 * * *"
    - cron: "*/20 13-16 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-devocionales
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Actualizar devocionales
        run: |
          python -u scrape_devocionales.py

      - name: Mostrar cambios
        run: |
          git status
          git diff -- data.json

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualizar devocionales diarios"
            git push
          fi
