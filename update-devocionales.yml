name: Actualizar devocionales diarios

on:
  schedule:
    # 09:00 UTC = 04:00 en Colombia (America/Bogota)
    - cron: "*/30 8-11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-devocionales
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Ejecutar scraper
        run: python scrape_devocionales.py

      - name: Validar data.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("data.json no contiene un objeto JSON")
          for key in ("encontacto", "bayless", "kenneth"):
              item = data.get(key)
              if item is not None and not item.get("titulo"):
                  raise SystemExit(f"{key} no tiene título")
          print("data.json válido")
          PY

      - name: Publicar data.json actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data.json"
          else
            git commit -m "Actualizar devocionales $(date -u +%Y-%m-%d)"
            git push
          fi
